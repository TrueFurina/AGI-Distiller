name: golden-regression

on:
  # 触发范围 = 「任何可能承载被断言事实的文本文件」。
  # 不逐个列文件名：机验的管辖面（断链覆盖全仓 .md、脚本引用覆盖全仓 .py、
  # 计数站点散落在全部文档）本来就跨全仓，按类型全覆盖才是完整的那一侧。
  # 完整性不靠人工维护 —— 由判据 D20 强制：凡被两套工具读到的文件，
  # 必须落在此范围内，否则 CI 红。
  #
  # 模式形式按 GitHub 官方示例（`'**.js'`，文档原话是它匹配"任意位置的 .js 文件"），
  # 不用 `**/*.md` —— 后者对**仓库根目录文件**的匹配行为官方没给权威说明。
  # 另显式补一条 `*.md` 兜底：仓库根的文档最多，这条无论如何都覆盖得住。
  push:
    branches: [main]
    paths:
      - '**.md'
      - '*.md'
      - '**.py'
      - '**.yml'
      - '**.yaml'
      - '**.json'
      - '**.sh'
      - '**.txt'
      - '**.toml'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '*.md'
      - '**.py'
      - '**.yml'
      - '**.yaml'
      - '**.json'
      - '**.sh'
      - '**.txt'
      - '**.toml'
      - '.gitignore'
  workflow_dispatch:

jobs:
  graders-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装判分器依赖（graders.py 依赖 PyYAML）
        run: pip install pyyaml
      - name: 判分器冒烟（mock 回复离线判分）
        run: |
          # 生成最小合规回复，验证判分器端到端可用（不依赖外部模型）
          mkdir -p .ci-smoke
          for c in golden/cases/*.yaml; do
            id=$(grep -E '^id:' "$c" | head -1 | sed 's/id:[[:space:]]*//')
            [ -n "$id" ] && echo "（CI 冒烟占位回复）" > ".ci-smoke/$id.txt"
          done
          python golden/graders.py --cases golden/cases --replies .ci-smoke --out .ci-smoke/report.json --model ci-smoke
          test -f .ci-smoke/report.json && echo "✅ 判分器端到端 OK（报告已落盘）"

  skill-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: skill 溯源标记机验（无裸规则）
        run: |
          python tools/check_skill_tags.py --self-test
          python tools/check_skill_tags.py

  doc-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 文档一致性机验（数字 / 路径 / 命令必须等于工作区事实）
        run: python scripts/check_doc_consistency.py
      - name: 文档一致性机验 —— 判据自身的变异验证
        run: python scripts/check_doc_consistency.py --self-test
      - name: 计数同步机验（数字必须等于工作区事实，不靠人工补）
        run: |
          python tools/sync_counts.py --self-test
          python tools/sync_counts.py

  workbuddy-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: WorkBuddy 通道同步器 —— 变异自验（临时 fixture，不碰真实目录）
        run: python tools/workbuddy_skills.py --self-test
      - name: frontmatter 字段取证器 —— 变异自验 + 无 bundle 时的诚实降级
        run: |
          python tools/wb_frontmatter_probe.py --self-test
          python tools/wb_frontmatter_probe.py --allow-missing

  distill-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 蒸馏管道 —— 变异自验
        run: python tools/distill_skills.py --self-test
      - name: 蒸馏管道 —— 体检（不可蒸馏是否已登记 / 产物去向是否可核验）
        run: python tools/distill_skills.py --check

  mock-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装判分器依赖（graders.py 依赖 PyYAML）
        run: pip install pyyaml
      - name: mock 回归（42 场景判分逻辑全绿）
        run: |
          python golden/graders.py --self-test
          # mock 回复目录存在时跑离线回归
          if [ -d golden/replies/mock ]; then
            python golden/run_golden.sh golden/replies/mock mock
          else
            echo "跳过：golden/replies/mock 不存在（判分器自检已覆盖逻辑）"
          fi
